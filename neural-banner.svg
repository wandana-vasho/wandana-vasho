<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .node { animation: pulse 3s ease-in-out infinite; }
      .node2 { animation: pulse 3s ease-in-out infinite; animation-delay: 0.5s; }
      .node3 { animation: pulse 3s ease-in-out infinite; animation-delay: 1s; }
      .node4 { animation: pulse 3s ease-in-out infinite; animation-delay: 1.5s; }
      .node5 { animation: pulse 3s ease-in-out infinite; animation-delay: 2s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; r: 4; }
        50% { opacity: 1; r: 7; }
      }
      .flowline {
        stroke-dasharray: 8 6;
        animation: flow 2s linear infinite;
      }
      @keyframes flow {
        to { stroke-dashoffset: -28; }
      }
      .title {
        font-family: 'Courier New', monospace;
        font-weight: bold;
        fill: #ffffff;
        animation: fadeIn 1.5s ease-out;
      }
      .subtitle {
        font-family: 'Courier New', monospace;
        fill: #06B6D4;
        animation: fadeIn 2s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Neural network mesh, left side -->
  <g stroke="url(#lineGrad)" stroke-width="1" opacity="0.5">
    <line class="flowline" x1="60" y1="80" x2="180" y2="60"/>
    <line class="flowline" x1="60" y1="80" x2="180" y2="140"/>
    <line class="flowline" x1="60" y1="180" x2="180" y2="140"/>
    <line class="flowline" x1="60" y1="180" x2="180" y2="220"/>
    <line class="flowline" x1="180" y1="60" x2="300" y2="100"/>
    <line class="flowline" x1="180" y1="140" x2="300" y2="100"/>
    <line class="flowline" x1="180" y1="140" x2="300" y2="180"/>
    <line class="flowline" x1="180" y1="220" x2="300" y2="180"/>
  </g>

  <g fill="#06B6D4" filter="url(#glow)">
    <circle class="node" cx="60" cy="80" r="5"/>
    <circle class="node3" cx="60" cy="180" r="5"/>
  </g>
  <g fill="#8B5CF6" filter="url(#glow)">
    <circle class="node2" cx="180" cy="60" r="5"/>
    <circle class="node4" cx="180" cy="140" r="5"/>
    <circle class="node5" cx="180" cy="220" r="5"/>
  </g>
  <g fill="#06B6D4" filter="url(#glow)">
    <circle class="node" cx="300" cy="100" r="5"/>
    <circle class="node3" cx="300" cy="180" r="5"/>
  </g>

  <!-- Mirrored mesh, right side -->
  <g stroke="url(#lineGrad)" stroke-width="1" opacity="0.5">
    <line class="flowline" x1="1140" y1="80" x2="1020" y2="60"/>
    <line class="flowline" x1="1140" y1="80" x2="1020" y2="140"/>
    <line class="flowline" x1="1140" y1="180" x2="1020" y2="140"/>
    <line class="flowline" x1="1140" y1="180" x2="1020" y2="220"/>
    <line class="flowline" x1="1020" y1="60" x2="900" y2="100"/>
    <line class="flowline" x1="1020" y1="140" x2="900" y2="100"/>
    <line class="flowline" x1="1020" y1="140" x2="900" y2="180"/>
    <line class="flowline" x1="1020" y1="220" x2="900" y2="180"/>
  </g>

  <g fill="#8B5CF6" filter="url(#glow)">
    <circle class="node4" cx="1140" cy="80" r="5"/>
    <circle class="node2" cx="1140" cy="180" r="5"/>
  </g>
  <g fill="#06B6D4" filter="url(#glow)">
    <circle class="node" cx="1020" cy="60" r="5"/>
    <circle class="node3" cx="1020" cy="140" r="5"/>
    <circle class="node5" cx="1020" cy="220" r="5"/>
  </g>
  <g fill="#8B5CF6" filter="url(#glow)">
    <circle class="node2" cx="900" cy="100" r="5"/>
    <circle class="node4" cx="900" cy="180" r="5"/>
  </g>

  <!-- Center text -->
  <text x="600" y="140" text-anchor="middle" class="title" font-size="44">WANDANA VASHO</text>
  <text x="600" y="175" text-anchor="middle" class="subtitle" font-size="16" letter-spacing="2">AI / BACKEND ENGINEER</text>

  <!-- Scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="#06B6D4" opacity="0.6">
    <animate attributeName="y" values="0;300;0" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
