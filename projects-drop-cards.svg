<svg width="100%" height="200" viewBox="0 0 1600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#141420"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      .card-title { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 15px; font-weight: 600; }
      .card-stat { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; fill: #4ADE80; }
      .card-bg { rx: 12; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="200" fill="url(#bgGrad2)"/>

  <!-- ground line -->
  <line x1="40" y1="172" x2="1560" y2="172" stroke="#1C1C21" stroke-width="2"/>

  <!-- Card 1: ML Capstone -->
  <g filter="url(#cardShadow)">
    <g>
      <rect class="card-bg" x="0" y="0" width="230" height="86" fill="#141417" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5" rx="12"/>
      <text class="card-title" x="16" y="30" fill="#06B6D4">🔬 ML Capstone</text>
      <text class="card-stat" x="16" y="52">F1 0.994 → 0.818</text>
      <text class="card-stat" x="16" y="70" fill="#8A8A93">leakage caught &amp; fixed</text>
      <animateTransform attributeName="transform" type="translate"
        values="60 -220; 60 -220; 60 90; 60 78; 60 86; 60 82; 60 86"
        keyTimes="0; 0.05; 0.42; 0.52; 0.62; 0.75; 1"
        calcMode="spline"
        keySplines="0 0 1 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1"
        dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Card 2: Billing Engine -->
  <g filter="url(#cardShadow)">
    <g>
      <rect class="card-bg" x="0" y="0" width="220" height="86" fill="#141417" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5" rx="12"/>
      <text class="card-title" x="16" y="30" fill="#8B5CF6">💳 Billing Engine</text>
      <text class="card-stat" x="16" y="52">26/26 tests</text>
      <text class="card-stat" x="16" y="70" fill="#8A8A93">idempotent under retries</text>
      <animateTransform attributeName="transform" type="translate"
        values="320 -220; 320 -220; 320 90; 320 78; 320 86; 320 82; 320 86"
        keyTimes="0; 0.12; 0.49; 0.59; 0.69; 0.82; 1"
        calcMode="spline"
        keySplines="0 0 1 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1"
        dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Card 3: Image Relevance -->
  <g filter="url(#cardShadow)">
    <g>
      <rect class="card-bg" x="0" y="0" width="250" height="86" fill="#141417" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5" rx="12"/>
      <text class="card-title" x="16" y="30" fill="#06B6D4">🖼️ Image Relevance</text>
      <text class="card-stat" x="16" y="52">83.3% top-1 precision</text>
      <text class="card-stat" x="16" y="70" fill="#8A8A93">25/25 tests</text>
      <animateTransform attributeName="transform" type="translate"
        values="600 -220; 600 -220; 600 90; 600 78; 600 86; 600 82; 600 86"
        keyTimes="0; 0.19; 0.56; 0.66; 0.76; 0.89; 1"
        calcMode="spline"
        keySplines="0 0 1 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1"
        dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Card 4: Social Publisher -->
  <g filter="url(#cardShadow)">
    <g>
      <rect class="card-bg" x="0" y="0" width="240" height="86" fill="#141417" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5" rx="12"/>
      <text class="card-title" x="16" y="30" fill="#8B5CF6">📡 Social Publisher</text>
      <text class="card-stat" x="16" y="52">28/28 tests</text>
      <text class="card-stat" x="16" y="70" fill="#8A8A93">crash-resume verified live</text>
      <animateTransform attributeName="transform" type="translate"
        values="900 -220; 900 -220; 900 90; 900 78; 900 86; 900 82; 900 86"
        keyTimes="0; 0.26; 0.63; 0.73; 0.83; 0.95; 1"
        calcMode="spline"
        keySplines="0 0 1 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1"
        dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Card 5: Widget Platform -->
  <g filter="url(#cardShadow)">
    <g>
      <rect class="card-bg" x="0" y="0" width="220" height="86" fill="#141417" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5" rx="12"/>
      <text class="card-title" x="16" y="30" fill="#06B6D4">🔐 Widget Platform</text>
      <text class="card-stat" x="16" y="52">18/18 tests</text>
      <text class="card-stat" x="16" y="70" fill="#8A8A93">tenant-isolated</text>
      <animateTransform attributeName="transform" type="translate"
        values="1180 -220; 1180 -220; 1180 90; 1180 78; 1180 86; 1180 82; 1180 86"
        keyTimes="0; 0.33; 0.7; 0.8; 0.87; 0.97; 1"
        calcMode="spline"
        keySplines="0 0 1 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1"
        dur="9s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
